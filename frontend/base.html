<style>
:root{--bg:#F7F5F2;--surface:#FFFFFF;--surface2:#F0EDE8;--line:#E1DCD3;--tx:#1C1A17;--mut:#6A645B;--sig:#C2410C;--sig-ink:#FFFFFF;--sig-soft:#FCE9DD;--acc:#3B5BDB;--acc-soft:#E6EBFB;--org:#0F766E;--org-soft:#DDF3EF;--ok:#15803D;--warn:#A16207;--bad:#B91C1C;--shadow:0 1px 2px rgba(28,26,23,.06),0 4px 14px rgba(28,26,23,.05);--r:12px;--pri:var(--sig);--teal:var(--sig);--bg2:var(--surface2);--card:var(--surface)}

.chip:hover{border-color:var(--sig);color:var(--sig);text-decoration:none}
.feed .item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}

.track div.d{border-color:var(--sig);color:var(--tx)}
.track div.c{border-color:var(--sig);opacity:.6}
.track div.x{border-color:var(--bad);color:var(--bad)}
.txbox{position:fixed;left:16px;right:16px;bottom:92px;z-index:55;max-width:560px;margin:0 auto}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.roles{grid-template-columns:repeat(3,1fr)}.how4{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:1.2fr .8fr}}
@media (min-width:1024px){body{padding-bottom:0}nav.tabs{display:none}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:8px}aside.side{display:block;padding:16px 8px 16px 16px;position:sticky;top:60px;align-self:start}main{padding:20px 16px 40px}.toast,.txbox{bottom:24px}}
@media (max-width:480px){#net{display:none}}

<body>

<script type="module">
import { createPublicClient, createWalletClient, custom, http, parseAbi, parseEther, formatEther } from "https://esm.sh/viem@2";
import { base, baseSepolia } from "https://esm.sh/viem@2/chains";

const DEFAULT_ADDRESS = "ADDRESS";
const ABI = parseAbi([
  "struct Gig { uint256 id; address freelancer; address client; string scope; string feeText; string briefUrl; uint256 cover; uint256 lock; uint256 deliverySecs; uint8 status; uint64 createdAt; uint64 offerExpires; uint64 claimedAt; string paymentRef; uint64 boundAt; uint8 boundBy; uint64 deliveryDeadline; uint64 deliveredAt; string deliveryText; string deliveryUrl; uint32 rejections; string rejectReason; uint256 deposit; uint64 evidenceDeadline; bool reopened; uint8 evClient; uint8 evFreelancer; uint8 verdict; bytes32 reasonCode; string reason; uint256 compensation; uint256 fee; uint64 resolvedAt; bool paymentEvidenceReviewed; uint256 claimDeposit; uint256 pendingComp; uint64 unlockAt; bool challenged; }",
  "struct Evidence { bool byClient; string text; string url; bytes32 digest; uint64 at; }",
  "struct FreelancerInfo { address owner; string handle; uint256 stake; uint256 locked; uint256 available; uint256 maxCover; uint256 score; uint256 lockBps; uint8 level; bool trusted; uint256 compensated; uint32 gigsBound; uint32 completedVerified; uint32 completedAuto; uint32 disputesLost; uint32 disputesSplit; uint32 disputesWon; uint32 inconclusive; uint32 rejectedClaims; uint32 lapsed; uint32 activeGigs; uint32 uniqueClients; }",
  "function registerFreelancer(string handle) payable",
  "function addStake() payable",
  "function withdrawStake(uint256 amount)",
  "function createGig(string scope, string feeText, string briefUrl, uint256 cover, uint256 deliveryHours) returns (uint256)",
  "function cancelGig(uint256 id)",
  "function expireOffer(uint256 id)",
  "function claimPayment(uint256 id, string paymentRef) payable",
  "function challengePayout(uint256 id, string text, string url)",
  "function finalizePayout(uint256 id)",
  "function respondPayment(uint256 id, bool accept, string reason)",
  "function bindByTimeout(uint256 id)",
  "function submitDelivery(uint256 id, string text, string url)",
  "function confirmDelivery(uint256 id)",
  "function finalizeGig(uint256 id)",
  "function openDispute(uint256 id, string claimText, string url) payable",
  "function submitEvidence(uint256 id, string text, string url)",
  "function resolveTimeout(uint256 id)",
  "function claim()",
  "function getGig(uint256 id) view returns (Gig)",
  "function getEvidence(uint256 id) view returns (Evidence[])",
  "function freelancerInfo(address who) view returns (FreelancerInfo)",
  "function isFreelancer(address who) view returns (bool)",
  "function freelancerByHandle(string handle) view returns (address)",
  "function freelancerCount() view returns (uint256)",
  "function freelancerAt(uint256 i) view returns (address)",
  "function gigCount() view returns (uint256)",
  "function totalStakes() view returns (uint256)",
  "function totalClaimable() view returns (uint256)",
  "function depositsHeld() view returns (uint256)",
  "function burned() view returns (uint256)",
  "function claimable(address who) view returns (uint256)",
  "function arbiter() view returns (address)",
  "function unit() view returns (uint256)",
  "function confirmWindow() view returns (uint256)",
  "function reviewWindow() view returns (uint256)",
  "function arbiterTimeout() view returns (uint256)",
  "function MIN_STAKE() view returns (uint256)",
  "function VERIFIED_STAKE() view returns (uint256)",
  "function PREMIUM_STAKE() view returns (uint256)",
  "function MAX_COVER_STARTER() view returns (uint256)",
  "function MAX_COVER_VERIFIED() view returns (uint256)",
  "function MAX_COVER_PREMIUM() view returns (uint256)",
  "function DISPUTE_DEPOSIT() view returns (uint256)",
  "function CLAIM_DEPOSIT() view returns (uint256)",
  "function LOCK_BPS_NEW() view returns (uint256)"
]);

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const CHAINS = { sepolia: baseSepolia, mainnet: base };
const qs = new URLSearchParams(location.search);
{
  const reqC = qs.get("c");
  if (reqC && /^0x[0-9a-fA-F]{40}$/.test(reqC) && reqC.toLowerCase() !== String(store.get("bmb_contract") || "").toLowerCase()) {
    let ok = false;
    try { ok = window.confirm("This link wants HireLock to use a different contract:\n" + reqC + "\n\nOnly continue if you trust whoever sent it. Anything you send goes to that contract."); } catch {}
    if (ok) store.set("bmb_contract", reqC);
  }
}
if (qs.get("n") && CHAINS[qs.get("n")]) store.set("bmb_net", qs.get("n"));
const S = { contract: store.get("bmb_contract") || DEFAULT_ADDRESS, net: store.get("bmb_net") || "sepolia", account: null, provider: null, busy: false, params: null, mini: null };
const chain = () => CHAINS[S.net] || baseSepolia;
const pub = () => (S.pc ||= createPublicClient({ chain: chain(), transport: http() }));
const validAddr = a => /^0x[0-9a-fA-F]{40}$/.test(a || "");
const ZERO = "0x0000000000000000000000000000000000000000";
const N = x => Number(x);
const eth = v => { const s = formatEther(BigInt(v || 0)); return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; };
const safeHref = u => /^https:\/\/[^\s"'<>\\]+$/.test(String(u)) ? esc(u) : "#";
const short = a => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const fmtTime = t => t ? new Date(N(t) * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
const now = () => Math.floor(Date.now() / 1000);
const ago = t => {
  t = N(t); if (!t) return "—";
  const d = now() - t, a = Math.abs(d);
  const u = a < 3600 ? [Math.max(1, Math.round(a / 60)), "min"] : a < 86400 ? [Math.round(a / 3600), "h"] : [Math.round(a / 86400), "d"];
  return d >= 0 ? `${u[0]}${u[1]} ago` : `in ${u[0]}${u[1]}`;
};
const STATUS = [["Open", "pri"], ["Payment claimed", "warn"], ["Awaiting delivery", "pri"], ["Work submitted", "pri"], ["Completed", "ok"], ["In dispute", "bad"], ["Dispute reopened", "bad"], ["Resolved", "warn"], ["Cancelled", ""], ["Expired", ""], ["Payout pending", "warn"], ["Payout challenged", "bad"]];
const ST = { OPEN: 0, CLAIMED: 1, ACTIVE: 2, DELIVERED: 3, COMPLETED: 4, DISPUTED: 5, REOPENED: 6, RESOLVED: 7, CANCELLED: 8, EXPIRED: 9, PAYOUT_PENDING: 10, CHALLENGED: 11 };
const VERDICT = ["", "Client wins", "Freelancer wins", "Split", "Insufficient evidence"];
const LEVEL = ["STARTER", "VERIFIED", "PREMIUM"];
const pill = s => { const [l, k] = STATUS[N(s)]; return `<span class="pill ${k}">${l}</span>`; };
const levelPill = l => `<span class="pill ${N(l) === 2 ? "pri" : N(l) === 1 ? "ok" : ""}">${LEVEL[N(l)]}</span>`;
const hexText = h => { try { return h.replace(/^0x/, "").replace(/(00)+$/, "").match(/.{2}/g)?.map(b => String.fromCharCode(parseInt(b, 16))).join("") || ""; } catch { return ""; } };

function toast(msg, kind = "") {
  const t = $("#toast");
  t.innerHTML = `<div class="toast ${kind}">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.innerHTML = "", kind === "err" ? 7000 : 3500);
}

async function read(functionName, args = []) {
  if (!validAddr(S.contract)) throw new Error("Contract address is not set. Open Settings.");
  return pub().readContract({ address: S.contract, abi: ABI, functionName, args });
}
const CONFIRM_FNS = {
  withdrawStake: "Move this part of your stake to your claimable balance?",
  claim: "Send your claimable balance to your wallet?",
  respondPayment: "Answer this payment claim? Rejecting burns the client's claim deposit.",
  challengePayout: "Challenge the pending payout? The ruling is re-reviewed once.",
  finalizePayout: "Release the pending payout to the client?",
  resolveTimeout: "Close this dispute as inconclusive and return deposits?",
  confirmDelivery: "Approve the submitted work? This completes the gig and cannot be undone.",
  registerFreelancer: "Register and lock this stake in the contract?",
  addStake: "Lock this extra stake in the contract?",
  claimPayment: "Claim the payment and put down the claim deposit?",
  openDispute: "Open a dispute and put down the dispute deposit?"
};
function confirmBox(title, body) {
  const d = $("#dlg");
  d.innerHTML = `<h3>${esc(title)}</h3><p class="mut">${esc(body)}</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec sm" value="no">Cancel</button><button class="btn sm" value="yes">Confirm</button></div>`;
  return new Promise(res => {
    d.onclose = () => res(d.returnValue === "yes");
    d.onclick = e => { if (e.target === d) d.close("no"); };
    for (const b of d.querySelectorAll("button")) b.onclick = () => d.close(b.value);
    try { d.returnValue = ""; d.showModal(); } catch { res(window.confirm(title + "\n\n" + body)); }
  });
}
function paintTrack(stage, fail) {
  const names = ["Signature", "Submitted", "Accepted", "Finalized"];
  $("#tx").innerHTML = stage < 0 ? "" : `<div class="card txbox"><div class="track">${names.map((n, i) => `<div class="${fail === i ? "x" : i < stage ? "d" : i === stage ? "c" : ""}">${n}</div>`).join("")}</div></div>`;
}
function explain(e) {
  const m = String(e?.shortMessage || e?.message || e || "");
  if (e?.code === 4001 || /user (rejected|denied)|rejected the request/i.test(m)) return "You declined the request in your wallet. Nothing was sent.";
  if (/insufficient funds|exceeds the balance/i.test(m)) return "Not enough ETH in this wallet for the amount plus gas.";
  if (/chain/i.test(m) && /mismatch|switch|wrong|unrecognized|not added/i.test(m)) return "Your wallet is on the wrong network. Switch to " + (S.net === "mainnet" ? "Base" : "Base Sepolia") + " and try again.";
  const r = m.match(/reverted with the following reason:\s*(.+?)(?:\n|$)/i) || m.match(/reason:\s*(.+?)(?:\n|$)/i);
  if (r) return "The contract refused this action: " + r[1].trim().slice(0, 200);
  return m.slice(0, 220) || "Transaction failed";
}
async function write(functionName, args = [], value = 0n, okMsg = "Done") {
  if (!S.account) { toast("Connect a wallet first", "err"); return null; }
  if (S.busy) return null;
  if (CONFIRM_FNS[functionName] || value > 0n) {
    const body = (CONFIRM_FNS[functionName] || "This sends ETH to the contract.") + (value > 0n ? ` Amount: ${eth(value)} ETH.` : "");
    if (!(await confirmBox("Please confirm", body))) return null;
  }
  S.busy = true; document.body.classList.add("busy");
  let stage = 0;
  try {
    const wc = createWalletClient({ chain: chain(), transport: custom(S.provider), account: S.account });
    try {
      const have = parseInt(await S.provider.request({ method: "eth_chainId" }), 16);
      if (have !== chain().id) {
        if (!(await confirmBox("Wrong network", "Your wallet is on another network. Switch to " + (S.net === "mainnet" ? "Base" : "Base Sepolia") + "?"))) return null;
        try { await wc.switchChain({ id: chain().id }); } catch (e) { await wc.addChain({ chain: chain() }); }
      }
    } catch (e) { toast(explain(e), "err"); return null; }
    if (value > 0n) {
      try {
        const bal = await pub().getBalance({ address: S.account });
        if (bal < value) { toast("Not enough ETH in this wallet. You need " + eth(value) + " ETH plus gas.", "err"); return null; }
      } catch {}
    }
    paintTrack(0);
    const hash = await wc.writeContract({ address: S.contract, abi: ABI, functionName, args, value });
    stage = 1; paintTrack(1);
    const rc = await pub().waitForTransactionReceipt({ hash });
    stage = 2; paintTrack(2);
    if (rc.status === "reverted") throw new Error("The transaction was mined but reverted.");
    stage = 3; paintTrack(3);
    toast(okMsg, "good");
    setTimeout(() => paintTrack(-1), 1500);
    return hash;
  } catch (e) {
    paintTrack(stage, stage);
    toast(explain(e), "err");
    setTimeout(() => paintTrack(-1), 4000);
    return null;
  } finally { S.busy = false; document.body.classList.remove("busy"); }
}

    else if (t >= dl) actions = `<button class="btn block" id="timeout">Bind gig (freelancer silent)</button>`;
  } else if (st === ST.ACTIVE) {
    const dd = N(d.deliveryDeadline);
    info = `Bound by ${["", "freelancer", "timeout"][N(d.boundBy)]}. Delivery deadline ${fmtTime(dd)} (${ago(dd)}).${N(d.boundBy) === 2 ? '<br><span class="pill warn">Freelancer never confirmed payment</span> Compensation is capped at 25% of the covered amount and needs reviewed payment proof.' : ""}`;
    if (isFreelancer) actions = `<label>Submitted work (what you built and where to find it)</label><textarea id="dtx" maxlength="1500"></textarea>
      <label>Work link (https, optional)</label><input id="dur" maxlength="300" placeholder="https://…">
      <button class="btn block" style="margin-top:10px" id="deliver">Submit delivery</button>`;
    if (isClient && t > dd && t <= dd + review) actions += disputeForm(p);
    if (t > dd + review) actions += `<button class="btn sec block" style="margin-top:10px" id="finalize">Close lapsed gig</button>`;
  } else if (st === ST.DELIVERED) {
    const rv = N(d.deliveredAt) + review;
    info = `Freelancer submitted the work ${ago(d.deliveredAt)}.<br><span class="word">${esc(d.deliveryText)}</span>${d.deliveryUrl ? `<br><a href="${safeHref(d.deliveryUrl)}" target="_blank" rel="noopener noreferrer">Proof link</a>` : ""}<br>Client can confirm or dispute until ${fmtTime(rv)}.`;
    if (isClient && t <= rv) actions = `<button class="btn block" id="confirm">The work looks good — approve</button>` + disputeForm(p);
    else if (t > rv) actions = `<button class="btn sec block" id="finalize">Complete gig (review window ended)</button>`;
  } else if (st === ST.PAYOUT_PENDING) {
    const ul = N(d.unlockAt);
    info = `<b>Ruling: ${VERDICT[N(d.verdict)]}</b> (payment was never confirmed by the freelancer)<br><span class="word">${esc(d.reason)}</span><br>Pending payout ${eth(d.pendingComp)} ETH. It unlocks ${fmtTime(ul)} (${ago(ul)}). The freelancer can challenge until then.`;
    if (isFreelancer && t < ul) actions = `<label>Challenge: why was payment never received?</label><textarea id="ctx" maxlength="1500"></textarea>
      <label>Work link (https, optional)</label><input id="cur" maxlength="300"><button class="btn block" style="margin-top:10px" id="challenge">Challenge payout</button>`;
    else if (t >= ul) actions = `<button class="btn block" id="finpay">Release payout</button>`;
  } else if (st === ST.DISPUTED || st === ST.REOPENED || st === ST.CHALLENGED) {
    const ed = N(d.evidenceDeadline);
    info = `Evidence closes ${fmtTime(ed)} (${ago(ed)}). Then the arbiter <span class="mono">${esc(short(p.arbiter))}</span> rules.${st === ST.REOPENED ? "<br>The first review found too little evidence. Both sides get one more chance." : st === ST.CHALLENGED ? "<br>The freelancer challenged the pending payout. The arbiter will re-review; a client ruling is then paid immediately (still capped)." : ""}`;
    if (t <= ed && (isClient || isFreelancer)) actions = `<label>Add evidence</label><textarea id="etx" maxlength="1500"></textarea>
      <label>Evidence link (https, optional)</label><input id="eur" maxlength="300"><button class="btn block" style="margin-top:10px" id="addev">Submit evidence</button>`;
    if (t > ed + N(p.arbiterTimeout)) actions = `<button class="btn sec block" id="atimeout">Arbiter silent — close as inconclusive</button>`;
  } else if (st === ST.RESOLVED) {
    info = `<b>${VERDICT[N(d.verdict)]}</b>${d.reason ? `<br><span class="word">${esc(d.reason)}</span>` : ""}<br>Reason code: <span class="mono">${esc(hexText(d.reasonCode))}</span><br>Compensation ${eth(d.compensation)} ETH · fee ${eth(d.fee)} ETH${N(d.boundBy) === 2 ? `<br>Payment unconfirmed by freelancer · cap 25% · payment evidence reviewed: ${d.paymentEvidenceReviewed ? "yes" : "no"}` : ""}`;
  } else if (st === ST.COMPLETED) info = "Gig completed.";
  else info = st === ST.CANCELLED ? "Offer cancelled." : "Expired.";

  view(`<div class="row between"><a href="#/" class="mut">← Gigs</a>${pill(d.status)}</div>
  <h1 class="word">${esc(d.scope)}</h1>${stepper(d)}
  <div class="grid">
    <div class="stat"><b>${esc(d.feeText)}</b><span>Fee (display only)</span></div>
    <div class="stat"><b style="color:var(--teal)">${eth(d.cover)} ETH</b><span>Covered amount</span></div>
  </div>
  <div class="warn-box" style="font-size:.85rem">Only the covered amount is protected, not the fee. The fee text is not enforced by the contract.</div>
  <div class="card word">${info}</div>
  <div class="card"><div class="row between"><span class="mut">Freelancer</span><a class="mono" href="#/freelancer/${esc(d.freelancer)}">${esc(short(d.freelancer))}</a></div>
  ${d.client !== ZERO ? `<div class="row between"><span class="mut">Client</span><span class="mono">${esc(short(d.client))}</span></div>` : ""}
  <div class="row between"><span class="mut">Stake locked</span><span>${eth(d.lock)} ETH</span></div>
  <div class="row between"><span class="mut">Delivery window</span><span>${Math.round(N(d.deliverySecs) / N(p.unit))} h</span></div>
  ${d.briefUrl ? `<div class="row between"><span class="mut">Brief</span><a href="${safeHref(d.briefUrl)}" target="_blank" rel="noopener noreferrer">open</a></div>` : ""}
  ${N(d.rejections) ? `<div class="row between"><span class="mut">Earlier claims rejected</span><span>${d.rejections}</span></div>` : ""}</div>
  ${actions ? `<div class="card">${actions}</div>` : ""}
  ${ev.length ? `<h2>Evidence on record</h2>${ev.map(e => `<div class="ev ${e.byClient ? "client" : "freelancer"}"><b>${e.byClient ? "client" : "freelancer"}</b> <span class="mut">${ago(e.at)}</span><div>${esc(e.text)}</div>${e.url ? `<a href="${safeHref(e.url)}" target="_blank" rel="noopener noreferrer" class="word">${esc(e.url)}</a>` : ""}<div class="mono mut" style="font-size:.7rem">keccak ${esc(e.digest.slice(0, 18))}…</div></div>`).join("")}` : ""}`);

  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  const go = async (fn, args, val, msg) => { if (await write(fn, args, val, msg)) route(); };
  on("#cancel", () => go("cancelGig", [id], 0n, "Offer cancelled"));
  on("#expire", () => go("expireOffer", [id], 0n, "Offer released"));
  on("#claimpay", () => { const v = $("#pref").value.trim(); if (v.length < 5) return toast("Add a payment reference (5+ characters)", "err"); go("claimPayment", [id, v], BigInt(p.CLAIM_DEPOSIT), "Payment claimed"); });
  on("#accept", () => go("respondPayment", [id, true, ""], 0n, "Gig is now binding"));
  on("#reject", () => { const v = $("#rrs").value.trim(); if (v.length < 5) return toast("Give a short reason", "err"); go("respondPayment", [id, false, v], 0n, "Claim rejected"); });
  on("#timeout", () => go("bindByTimeout", [id], 0n, "Gig is now binding"));
  on("#deliver", () => { const v = $("#dtx").value.trim(); if (v.length < 3) return toast("Describe the delivery", "err"); go("submitDelivery", [id, v, $("#dur").value.trim()], 0n, "Delivery submitted"); });
  on("#confirm", () => go("confirmDelivery", [id], 0n, "Thanks — gig completed"));
  on("#finalize", () => go("finalizeGig", [id], 0n, "Gig closed"));
  on("#dispute", () => { const v = $("#dcl").value.trim(); if (v.length < 10) return toast("Describe the problem (10+ characters)", "err"); go("openDispute", [id, v, $("#dur2").value.trim()], BigInt(p.DISPUTE_DEPOSIT), "Dispute opened"); });
  on("#addev", () => { const v = $("#etx").value.trim(); if (v.length < 5) return toast("Write the evidence (5+ characters)", "err"); go("submitEvidence", [id, v, $("#eur").value.trim()], 0n, "Evidence recorded"); });
  on("#challenge", () => { const v = $("#ctx").value.trim(); if (v.length < 5) return toast("Explain the challenge (5+ characters)", "err"); go("challengePayout", [id, v, $("#cur").value.trim()], 0n, "Payout challenged"); });
  on("#finpay", () => go("finalizePayout", [id], 0n, "Payout released"));
  on("#atimeout", () => go("resolveTimeout", [id], 0n, "Closed as inconclusive"));
}

async function pageNew() {
  if (!S.account) { view(`<h1>New gig</h1><div class="card"><p>Connect a wallet to create an offer.</p><button class="btn" id="c2">Connect</button></div>`); $("#c2").onclick = connect; return; }
  const freelancer = await read("freelancerInfo", [S.account]);
  if (!(await read("isFreelancer", [S.account]))) return view(`<h1>New gig</h1><div class="card"><p>You need to be a registered freelancer first.</p><a class="btn" href="#/become">Become a freelancer</a></div>`);
  view(`<h1>New gig</h1>
  <div class="card"><div class="row between"><span class="mut">You can cover up to</span><b style="color:var(--teal)">${eth(freelancer.available)} ETH</b></div>
  <div class="mut" style="font-size:.85rem">Stake locked per gig: ${N(freelancer.lockBps) / 100}% of the covered amount.</div></div>
  <label>Scope of work (what exactly you will deliver)</label><textarea id="scope" maxlength="600" placeholder="Landing page design in Figma: hero, pricing and footer sections, two revision rounds, handoff as a Figma link."></textarea>
  <label>Fee (shown to the client, e.g. “400 USD”)</label><input id="price" maxlength="80">
  <label>Brief link (https, optional)</label><input id="lurl" maxlength="300" placeholder="https://…">
  <label>Covered amount (ETH)</label><input id="prot" inputmode="decimal" placeholder="0.002">
  <label>Delivery time (hours)</label><input id="hrs" type="number" min="1" max="720" step="1" value="72" inputmode="numeric">
  <button class="btn block" style="margin-top:16px" id="create">Create offer</button>`);
  $("#create").onclick = async () => {
    const scope = $("#scope").value.trim(), price = $("#price").value.trim(), hrs = parseInt($("#hrs").value, 10);
    let prot; try { prot = parseEther($("#prot").value.trim()); } catch { prot = 0n; }
    if (scope.length < 10 || !price || prot <= 0n || !(hrs >= 1)) return toast("Fill every required field", "err");
    if (await write("createGig", [scope, price, $("#lurl").value.trim(), prot, BigInt(hrs)], 0n, "Offer created")) location.hash = "#/freelancer/" + S.account;
  };
}

async function pageBecome() {
  const p = await params();
  view(`<h1>Become a <span class="sig">staked</span> freelancer</h1>
  <p class="mut">Lock ETH as a stake. If you fail to deliver and lose a dispute, clients are paid from it.</p>
  <div class="card">
  <div class="row between"><span>STARTER</span><span class="mut">${eth(p.MIN_STAKE)}+ ETH · up to ${eth(p.MAX_COVER_STARTER)} per gig</span></div>
  <div class="row between"><span>VERIFIED</span><span class="mut">${eth(p.VERIFIED_STAKE)}+ ETH · up to ${eth(p.MAX_COVER_VERIFIED)}</span></div>
  <div class="row between"><span>PREMIUM</span><span class="mut">${eth(p.PREMIUM_STAKE)}+ ETH · up to ${eth(p.MAX_COVER_PREMIUM)}</span></div></div>
  <label>Handle (lowercase letters, numbers, _ and .; 3–30)</label><input id="handle" maxlength="30" autocapitalize="none" placeholder="my_studio">
  <label>Stake (ETH)</label><input id="stake" inputmode="decimal" value="${eth(p.MIN_STAKE)}">
  <div class="warn-box" style="margin-top:12px">Your handle is a label you choose. HireLock does not prove you own the Upwork, Fiverr, GitHub or Telegram account with that name.</div>
  <button class="btn block" style="margin-top:14px" id="reg">Register and lock stake</button>`);
  $("#reg").onclick = async () => {
    const h = $("#handle").value.trim().toLowerCase();
    let v; try { v = parseEther($("#stake").value.trim()); } catch { v = 0n; }
    if (!/^[a-z0-9_.]{3,30}$/.test(h)) return toast("Invalid handle", "err");
    if (v < BigInt(p.MIN_STAKE)) return toast("Stake is below the minimum", "err");
    if (await write("registerFreelancer", [h], v, "Registered")) location.hash = "#/freelancer/" + h;
  };
}

async function pageMe() {
  if (!S.account) { view(`<h1>Me</h1><div class="card"><p>Connect a wallet to see your gigs and balance.</p><button class="btn" id="c3">Connect</button></div>`); $("#c3").onclick = connect; return; }
  skeleton();
  const a = S.account.toLowerCase();
  const [cl, isS, gigs] = await Promise.all([read("claimable", [S.account]), read("isFreelancer", [S.account]), allGigs(100)]);
  const freelancer = isS ? await read("freelancerInfo", [S.account]) : null;
  const mine = gigs.filter(d => d.freelancer.toLowerCase() === a || d.client.toLowerCase() === a);
  view(`<h1>Me</h1><div class="mono mut word">${esc(S.account)}</div>
  <div class="card"><div class="row between"><div><div class="mut">Claimable balance</div><b style="font-size:1.5rem">${eth(cl)} ETH</b></div>
  <button class="btn" id="claim" ${BigInt(cl) === 0n ? "disabled" : ""}>Claim</button></div></div>
  ${freelancer ? freelancerCard(freelancer) : `<a class="btn sec block" href="#/become">Become a freelancer</a>`}
  <h2>My gigs</h2>${mine.length ? mine.map(gigCard).join("") : '<div class="empty">No gigs yet.</div>'}
  <p><a href="#/settings">Settings</a></p>`);
  $("#claim").onclick = async () => { if (await write("claim", [], 0n, "Sent to your wallet")) route(); };
}

async function pageHow() {
  view(`<h1>How HireLock works</h1>
  <div class="card"><b>1. Freelancer posts a stake</b><p class="mut">ETH is locked in the contract. The stake sets how much value one freelancer can cover.</p></div>
  <div class="card"><b>2. Freelancer lists a covered gig</b><p class="mut">150% of the covered amount stays locked (120% for proven freelancers) until the gig ends.</p></div>
  <div class="card"><b>3. Client pays off-chain, then claims</b><p class="mut">Pay by bank transfer, cash app or anything the freelancer accepts, then paste the payment reference. The freelancer can accept or reject. If they stay silent for 24 h, the gig binds anyway.</p></div>
  <div class="card"><b>4. Delivery</b><p class="mut">The freelancer submits the finished work (a link and a note). The client approves it, or after 72 h it completes on its own.</p></div>
  <div class="card"><b>5. Dispute</b><p class="mut">The client puts down a small deposit. Both sides add up to 3 pieces of evidence. A designated arbiter then rules: client wins (full covered amount), split (half), freelancer wins, or not enough evidence (one more round, then no payout). If the arbiter stays silent for 7 days anyone can close the dispute with no payout and deposits are returned.</p></div>
  <h2>What it cannot do</h2>
  <div class="warn-box"><ul style="margin:0;padding-left:18px">
  <li>It cannot see your bank and never opens links. Payments and work are judged only from the text people submit.</li>
  <li>On Base the arbiter is a person or multisig chosen by the contract owner, not an AI. You are trusting that arbiter.</li>
  <li>Handles are not verified accounts.</li>
  <li>When the freelancer stays silent about a payment, any compensation is capped at 25%, needs reviewed payment proof, and is paid only after a 7-day window in which the freelancer can challenge.</li>
  <li>Claiming a payment needs a refundable deposit; it is burned (paid to nobody) if the freelancer rejects the claim.</li>
  <li>Compensation covers the covered amount, not necessarily the full fee.</li>
  <li>This is an unaudited prototype. Use Base Sepolia, not real money.</li></ul></div>`);
}

async function pageSettings() {
  view(`<h1>Settings</h1>
  <div class="card"><label>Network</label><select id="netsel"><option value="sepolia" ${S.net === "sepolia" ? "selected" : ""}>Base Sepolia (testnet)</option><option value="mainnet" ${S.net === "mainnet" ? "selected" : ""}>Base mainnet</option></select>
  <label>Contract address</label><input id="caddr" class="mono" value="${esc(S.contract)}" placeholder="0x…">
  <button class="btn block" style="margin-top:10px" id="save">Save</button>
  <p class="mut" style="font-size:.85rem">You can also open this page with <code>?c=0x…&amp;n=sepolia</code>.</p></div>`);
  $("#save").onclick = () => {
    const v = $("#caddr").value.trim();
    if (!validAddr(v)) return toast("Not a valid address", "err");
    store.set("bmb_contract", v); store.set("bmb_net", $("#netsel").value);
    S.contract = v; S.net = $("#netsel").value; S.pc = null; S.params = null;
    paintWallet(); toast("Saved", "good"); location.hash = "#/";
  };
}

async function route() {
  const h = location.hash || "#/";
  paintTabs(h);
  const parts = h.slice(2).split("/");
  try {
    if (parts[0] !== "settings" && parts[0] !== "how" && !validAddr(S.contract)) return pageSettings();
    switch (parts[0]) {
      case "": return await pageHome();
      case "freelancers": return await pageFreelancers();
      case "freelancer": return await pageFreelancer(decodeURIComponent(parts[1] || ""));
      case "gig": return await pageGig(decodeURIComponent(parts[1] || ""));
      case "new": return await pageNew();
      case "become": return await pageBecome();
      case "me": return await pageMe();
      case "how": return await pageHow();
      case "settings": return await pageSettings();
      default: return await pageHome();
    }
  } catch (e) { console.error(e); errBox(e); }
}
window.addEventListener("hashchange", route);
paintWallet();
route();

(async () => {
  try {
    const mod = await import("https://esm.sh/@farcaster/miniapp-sdk@latest");
    const sdk = mod.sdk || mod.default;
    S.mini = sdk;
    const inMini = await sdk.isInMiniApp?.();
    if (inMini) {
      S.provider = await sdk.wallet.getEthereumProvider();
      await sdk.actions.ready();
      if (S.provider) { const accs = await S.provider.request({ method: "eth_accounts" }).catch(() => []); if (accs[0]) { S.account = accs[0]; paintWallet(); route(); } }
    }
  } catch {}
  if (!S.account && store.get("bmb_auto") && window.ethereum) {
    window.ethereum.request({ method: "eth_accounts" }).then(acc => { if (acc && acc[0]) { S.provider = window.ethereum; S.account = acc[0]; paintWallet(); route(); } }).catch(() => {});
  }
})();
</script>
